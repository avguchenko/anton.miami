name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Syntax check + Worker build (dry run)
        run: npm run check
      - name: Both variants carry tracking and preview tags
        run: |
          for v in dawn chart; do
            f="public/variants/$v/index.html"
            grep -q "name=\"ab-variant\" content=\"$v\"" "$f"
            grep -q '/ab/track.js' "$f"
            grep -q 'property="og:image"' "$f"
          done
      - name: Analysis report renders (demo data)
        run: node scripts/analyze.mjs --demo > /dev/null
