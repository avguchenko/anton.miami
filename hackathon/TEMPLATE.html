<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="REPLACE: one-line concept and core mechanic">
<title>Hackathon NN · Genre · Title</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none;
    font-family: system-ui, -apple-system, sans-serif; color: #eee; }
  canvas { display: block; width: 100vw; height: 100vh; }
  /* Keep important UI clear of notches and rounded corners: use these as minimum offsets. */
  :root { --safe-top: env(safe-area-inset-top, 0px); --safe-right: env(safe-area-inset-right, 0px);
          --safe-bottom: env(safe-area-inset-bottom, 0px); --safe-left: env(safe-area-inset-left, 0px); }
  #mute { display: none; position: fixed; top: calc(8px + var(--safe-top)); right: calc(8px + var(--safe-right));
    width: 44px; height: 44px; border: 0; border-radius: 22px; background: rgba(255,255,255,0.12);
    color: #eee; font: 20px system-ui, sans-serif; cursor: pointer; }
  #err { display: none; position: fixed; inset: 0; background: #300; color: #fff;
    padding: 16px; white-space: pre-wrap; font: 14px monospace; overflow: auto; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="mute" aria-label="Mute sound" title="Mute (M)">&#128266;</button>
<div id="err"></div>
<script>
/*
  Hackathon skeleton. Fill in every marked placeholder block and delete the markers; keep the plumbing.
  - Errors show on screen instead of a blank page.
  - Canvas is sized from the viewport and devicePixelRatio, and resizes.
  - One pointer handler covers mouse, touch and pen; one key handler covers keyboard.
  - Audio is created only inside a user gesture (browsers block it otherwise).
  - The loop starts exactly once and clamps dt so a backgrounded tab cannot explode the physics.
*/
(function () {
  'use strict';

  var errBox = document.getElementById('err');
  window.addEventListener('error', function (e) {
    errBox.style.display = 'block';
    errBox.textContent += (e.message || 'Error') + '\n';
  });
  window.addEventListener('unhandledrejection', function (e) {
    errBox.style.display = 'block';
    errBox.textContent += 'Unhandled: ' + (e.reason && e.reason.message || e.reason) + '\n';
  });

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // Respect people who ask their device for less motion: slow or skip
  // shakes, flashes and fast camera moves when this is true.
  var reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  var state = { mode: 'title', t: 0, last: 0 };

  // ---- Audio: created lazily, only from a gesture, always through the master
  // gain so the mute button works. The mute button appears only once sound exists;
  // entries without sound never show it.
  var audio = null, master = null, muted = false;
  var muteBtn = document.getElementById('mute');
  function ensureAudio() {
    if (!audio) {
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        audio = AC ? new AC() : null;
        if (audio) {
          master = audio.createGain();
          master.gain.value = muted ? 0 : 0.6;
          master.connect(audio.destination);
          muteBtn.style.display = 'block';
        }
      } catch (err) {
        audio = null;
      }
    }
    if (audio && audio.state === 'suspended') audio.resume();
    return audio;
  }
  function setMuted(m) {
    muted = m;
    if (master) master.gain.value = muted ? 0 : 0.6;
    muteBtn.innerHTML = muted ? '&#128263;' : '&#128266;';
    muteBtn.setAttribute('aria-label', muted ? 'Unmute sound' : 'Mute sound');
  }
  muteBtn.addEventListener('click', function (e) { e.stopPropagation(); setMuted(!muted); });
  // A soft tone helper. Connect any custom nodes to master, never to audio.destination.
  function tone(freq, dur, type, vol) {
    var ac = ensureAudio(); if (!ac || muted) return;
    var o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol || 0.2, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.2));
    o.connect(g); g.connect(master); o.start(t); o.stop(t + (dur || 0.2) + 0.02);
  }

  // ---- Network (optional): use only when the idea needs live data.
  // Resolves to parsed JSON, or to null on any failure or after a timeout,
  // so the caller always has a plain branch for "couldn't load" and the page
  // never throws offline. Never put keys or secrets in this file, and show the
  // data's source on screen.
  function getJSON(url, ms) {
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, ms || 8000);
    return fetch(url, ctrl ? { signal: ctrl.signal } : {})
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; })
      .then(function (v) { clearTimeout(timer); return v; });
  }

  // ---- Input: one path for pointer and keyboard
  function startGame() {
    state.mode = 'play';
    state.t = 0;
    // REPLACE: reset game state here
  }

  function onTap(x, y) {
    ensureAudio();
    if (state.mode === 'title') { tone(523, 0.25); startGame(); return; }
    // REPLACE: handle a tap in play at (x, y), CSS pixels
  }

  function onKey(key) {
    if (key === 'm' || key === 'M') { setMuted(!muted); return; }
    ensureAudio();
    if (state.mode === 'title' && (key === ' ' || key === 'Enter')) { startGame(); return; }
    // REPLACE: handle keys in play
  }

  canvas.addEventListener('pointerdown', function (e) {
    if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
    onTap(e.clientX, e.clientY);
  });
  window.addEventListener('keydown', function (e) { onKey(e.key); });

  // ---- Simulation and drawing
  function update(dt) {
    state.t += dt;
    if (state.mode === 'play') {
      // REPLACE: advance game state by dt seconds
    }
  }

  function drawTitle() {
    var s = Math.min(W, H);
    ctx.fillStyle = '#eee';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = Math.round(s / 12) + 'px system-ui, sans-serif';
    ctx.fillText('REPLACE TITLE', W / 2, H / 2);
    ctx.font = Math.round(s / 30) + 'px system-ui, sans-serif';
    ctx.fillText('Tap or press Space to start', W / 2, H / 2 + s / 8);
  }

  function drawPlay() {
    // REPLACE: draw the play state
  }

  function draw() {
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, W, H);
    if (state.mode === 'title') drawTitle();
    else drawPlay();
  }

  // ---- Loop: started once
  function frame(now) {
    var dt = state.last ? Math.min((now - state.last) / 1000, 0.05) : 0;
    state.last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
